<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZET time loss</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        :root {
            --surface: #fcfcfb;
            --plane: #f9f9f7;
            --ink: #0b0b0b;
            --ink-2: #52514e;
            --muted: #898781;
            --grid: #e1e0d9;
            --axis: #c3c2b7;
            --border: rgba(11, 11, 11, 0.10);
            /* split categories: fixed slots 1-3 */
            --running: #2a78d6;
            --stopped: #eb6834;
            --dwell: #1baf7a;
            /* sequential (ordinal steps 250-700) */
            --seq-1: #86b6ef; --seq-2: #5598e7; --seq-3: #2a78d6; --seq-4: #1c5cab; --seq-5: #0d366b;
            font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
            color: var(--ink);
        }
        body { margin: 0; background: var(--plane); }
        .layout { display: flex; height: 100vh; }
        #map { flex: 1; min-width: 0; }
        /* Grey, faded basemap so the segment colours carry the data. */
        .muted-tiles { filter: grayscale(1) contrast(0.85) brightness(1.08); opacity: 0.75; }
        aside {
            width: 400px; overflow-y: auto; background: var(--surface);
            border-left: 1px solid var(--border); padding: 16px 18px 32px; box-sizing: border-box;
        }
        @media (max-width: 800px) {
            .layout { flex-direction: column; height: auto; }
            #map { height: 60vh; flex: none; }
            aside { width: 100%; border-left: 0; }
        }
        h1 { font-size: 18px; margin: 0 0 2px; }
        h2 { font-size: 13px; font-weight: 600; margin: 22px 0 8px; }
        .sub { color: var(--ink-2); font-size: 13px; margin: 0 0 12px; }
        .filters { display: flex; flex-wrap: wrap; gap: 8px; }
        .filters label { font-size: 12px; color: var(--ink-2); display: flex; flex-direction: column; gap: 3px; }
        select { font: inherit; font-size: 13px; padding: 4px 6px; border: 1px solid var(--axis); border-radius: 6px; background: #fff; }
        .tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 14px; }
        .tile { border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; }
        .tile .v { font-size: 20px; font-weight: 600; }
        .tile .l { font-size: 11px; color: var(--ink-2); }
        .split { display: flex; gap: 2px; height: 10px; margin: 6px 0 4px; }
        .split span { display: block; height: 100%; }
        .split span:first-child { border-radius: 4px 0 0 4px; }
        .split span:last-child { border-radius: 0 4px 4px 0; }
        .split-legend { display: flex; gap: 12px; flex-wrap: wrap; font-size: 12px; color: var(--ink-2); }
        .swatch { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 4px; vertical-align: -1px; }
        .chart { position: relative; }
        .chart svg { display: block; width: 100%; height: 110px; overflow: visible; }
        .tip {
            position: absolute; pointer-events: none; background: var(--ink); color: #fff; font-size: 12px;
            padding: 3px 7px; border-radius: 5px; white-space: nowrap; transform: translate(-50%, -100%);
        }
        .top { list-style: none; margin: 0; padding: 0; }
        .top li { display: grid; grid-template-columns: 18px 1fr auto; gap: 6px; align-items: center; padding: 5px 4px; border-radius: 6px; cursor: pointer; font-size: 12.5px; }
        .top li:hover { background: var(--plane); }
        .top .rank { color: var(--muted); font-variant-numeric: tabular-nums; }
        .top .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .top .routes { color: var(--muted); }
        .top .val { font-variant-numeric: tabular-nums; color: var(--ink-2); }
        .top .bar { grid-column: 2 / 4; height: 4px; background: var(--seq-3); border-radius: 0 4px 4px 0; }
        table { border-collapse: collapse; width: 100%; font-size: 12px; }
        th, td { text-align: right; padding: 4px 4px; border-bottom: 1px solid var(--grid); font-variant-numeric: tabular-nums; }
        th:first-child, td:first-child { text-align: left; }
        th { color: var(--ink-2); font-weight: 500; cursor: pointer; user-select: none; }
        .table-wrap { overflow-x: auto; max-height: 360px; overflow-y: auto; }
        .note { font-size: 11.5px; color: var(--muted); line-height: 1.45; }
        .legend { background: var(--surface); padding: 8px 10px; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,.15); font-size: 12px; }
        .legend .row { display: flex; align-items: center; gap: 6px; margin: 2px 0; }
        .legend .line { width: 22px; height: 4px; border-radius: 2px; }
        .popup h3 { font-size: 13px; margin: 0 0 4px; }
        .popup .kv { display: grid; grid-template-columns: auto auto; gap: 1px 12px; font-size: 12px; margin-top: 6px; }
        .popup .kv span:nth-child(odd) { color: var(--ink-2); }
        .empty { color: var(--ink-2); font-size: 13px; }
    </style>
</head>
<body>
<div class="layout">
    <div id="map"></div>
    <aside>
        <h1>Where ZET loses time</h1>
        <p class="sub">Time lost = stopped away from stops + running slower than free flow. <a href="/">Live map</a></p>
        <div class="filters">
            <label>Day <select id="day"></select></label>
            <label>From <select id="from"></select></label>
            <label>To <select id="to"></select></label>
            <label>Mode
                <select id="mode">
                    <option value="all">All</option>
                    <option value="tram">Trams</option>
                    <option value="bus">Buses</option>
                </select>
            </label>
            <label>Colour by
                <select id="metric">
                    <option value="total">Total time lost</option>
                    <option value="per">Lost per vehicle</option>
                    <option value="speed">Mean speed</option>
                </select>
            </label>
        </div>

        <div class="tiles">
            <div class="tile"><div class="v" id="t-lost">–</div><div class="l">vehicle-hours lost</div></div>
            <div class="tile"><div class="v" id="t-trav">–</div><div class="l">segment traversals</div></div>
            <div class="tile"><div class="v" id="t-km">–</div><div class="l">km driven (day)</div></div>
        </div>
        <h2>Where the time goes</h2>
        <div class="split" id="split"></div>
        <div class="split-legend" id="split-legend"></div>

        <h2>Vehicles in service</h2>
        <div class="chart" id="vpm"></div>

        <h2>Top 20 segments by time lost</h2>
        <ol class="top" id="top"></ol>

        <h2>Routes</h2>
        <div class="table-wrap"><table id="routes"></table></div>

        <h2>Data quality</h2>
        <div class="note" id="quality"></div>
    </aside>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="analytics.js"></script>
</body>
</html>
